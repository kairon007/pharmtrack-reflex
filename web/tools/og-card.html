<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PharmTrack share card</title>
    <style>
      @font-face {
        font-family: "Bricolage Grotesque";
        src: url("../assets/fonts/bricolage-grotesque-latin-opsz-normal.Cre6nC2_.woff2") format("woff2-variations");
        font-weight: 200 800;
        font-display: block;
      }
      @font-face {
        font-family: "Instrument Sans";
        src: url("../assets/fonts/instrument-sans-latin-wght-normal.BbzFLZTg.woff2") format("woff2-variations");
        font-weight: 400 700;
        font-display: block;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #f4f8f7;
        display: flex;
        align-items: center;
        gap: 64px;
        padding: 72px 80px;
        font-family: "Instrument Sans", system-ui, sans-serif;
        color: #1b2725;
        overflow: hidden;
      }
      .glow {
        position: absolute;
        width: 720px;
        height: 720px;
        right: -260px;
        top: -260px;
        border-radius: 50%;
        background: radial-gradient(circle, #0f766e26 0%, #0f766e00 70%);
      }
      .icon {
        width: 320px;
        height: 320px;
        border-radius: 72px;
        box-shadow: 0 40px 80px -30px #0f766e66;
        flex-shrink: 0;
        position: relative;
      }
      .icon img {
        width: 100%;
        height: 100%;
        border-radius: 72px;
        display: block;
      }
      .copy {
        position: relative;
      }
      h1 {
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 800;
        font-size: 92px;
        line-height: 0.98;
        letter-spacing: -0.045em;
        margin-bottom: 22px;
      }
      p {
        font-size: 33px;
        line-height: 1.35;
        color: #4b5d58;
        max-width: 15ch;
        margin-bottom: 32px;
      }
      .pill {
        display: inline-block;
        background: #d9ecea;
        color: #0b5e57;
        border-radius: 999px;
        padding: 12px 24px;
        font-size: 26px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="icon"><img src="../assets/img/mark.png" alt="" /></div>
    <div class="copy">
      <h1>PharmTrack</h1>
      <p>Your private medication and health companion.</p>
      <span class="pill">Free · Works offline</span>
    </div>
  </body>
</html>
