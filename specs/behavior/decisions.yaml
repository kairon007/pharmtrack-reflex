# Decision registry. Every deliberate divergence from PharmTrack v0.0.19 is recorded here
# with an id. Journeys cite these ids so a reader can tell "this is parity" from "this is a
# bug we chose to fix". Anything NOT listed here is parity: reproduce v0.0.19 exactly.
#
# D1-D5 were resolved before Phase 0 shipped. D6-D13 were resolved by Amit on 2026-11-07
# at the Phase 1 boundary. D14-D16 are engineering resolutions needed to make parity
# testable at all; they are flagged REVIEW_AT_FREEZE.

schema: reflex/decisions/1

decisions:

  - id: D1
    topic: Notification reset semantics
    resolved: 2026-11-07
    status: accepted
    rule: Clear all pending notifications, then schedule the planner's complete output.
    legacy: iOS did removeAllPendingNotificationRequests; Android updated incrementally.
    rationale: The iOS path is canonical. Android's incremental path leaves orphans.
    affects: [notification_planner, settings_draft_commit]

  - id: D2
    topic: vitals_detail highlight auto-clear
    resolved: 2026-11-07
    status: accepted
    rule: Keep the 0.9s clear. Assert only the eventual state, never the duration.
    legacy: asyncAfter(0.9) clears highlightedVitalID if it still equals the tapped id.
    rationale: Timing is not behavior. The Scheduler fixture fires on flush().
    affects: [vitals_detail_navigation]

  - id: D3
    topic: First-launch demo data
    resolved: 2026-11-07
    status: accepted
    rule: Keep demo seeding on first launch; clear it when onboarding completes.
    legacy: populateMockData() gated on !hasCompletedOnboarding.
    rationale: The tour is empty and pointless without content.
    affects: [app_load, onboarding_journey]
    amended_by: D7

  - id: D4
    topic: Vitals row icon
    resolved: 2026-11-07
    status: accepted
    rule: The row icon derives from Vital.type via icons.yaml, never a fixed scalemass.
    legacy: VitalsView hardcoded "scalemass" for all three types; AllVitalsView already
           derived it correctly, so the two screens disagreed.
    rationale: A blood-sugar row showing a weighing scale is wrong.
    affects: [vital_crud, vitals_detail_navigation]

  - id: D5
    topic: Minimum OS versions
    resolved: 2026-11-07
    status: accepted
    rule: iOS 17; Android minSdk from the existing version catalog.
    rationale: Core is pure Swift / pure JVM, so the floor is a UI-layer concern only.
    affects: []

  - id: D6
    topic: Mark taken is guarded on both screens; the count is per medication
    resolved: 2026-11-07
    status: accepted
    rule: |
      markTaken is a no-op when that medication already has a dose logged today.
      The guard lives in the REDUCER, not the view, so every entry point is covered.
      takenTodayCount counts DISTINCT medications with a dose today, not log rows.
      The min(count, total) display clamp is consequently removed; it cannot trigger.
    legacy: |
      MedicationTrackerView.swift:210 guarded the row tap in the view.
      DashboardView.swift:204 called markMedicationTaken with no guard at all, so repeated
      taps on the hero button decremented stock repeatedly and appended duplicate logs.
      Both screens computed takenTodayCount by counting log rows
      (DashboardView.swift:33-37, MedicationTrackerView.swift:20-24).
    rationale: |
      Two screens, one action, two rules is not a behavior worth preserving. Guarding in
      the reducer also makes the guard testable without a UI.
    identity_rule: |
      "Already taken today" resolves by Log.medicationId when present, and falls back to the
      legacy description.contains(med.name) match when absent. The fallback keeps the
      name-collision false positive for pre-1.0 logs; that is asserted, not smoothed over.
      See legacy_pre_medication_id.json.
    affects: [medication_lifecycle, dashboard_derivation, medication_search_and_segments]

  - id: D7
    topic: The demo seed is repaired
    resolved: 2026-11-07
    status: accepted
    rule: |
      The seeded log refers to Vitamin D3, the first seeded medication, and carries
      medicationId = seed_medication_1. Description becomes "Vitamin D3 Dose Taken".
      Result: 1 of 3 taken, and exactly the Vitamin D3 row renders checked.
    legacy: |
      MedicalViewModel.swift:134-140 wrote "Omega-3 Dose Taken" while no seeded medication
      was named Omega-3. Dashboard showed 1/3 taken while zero tracker rows were checked.
    rationale: |
      D3 keeps the seed, but an internally inconsistent seed teaches the user the app is
      broken during the very first run. Same shape (1/3), coherent content.
    supersedes: The known_quirk block in fixtures/index.yaml#seeded_demo.
    affects: [app_load, onboarding_journey, dashboard_derivation, medication_search_and_segments]

  - id: D8
    topic: The low-stock badge reads the setting
    resolved: 2026-11-07
    status: accepted
    rule: |
      isLowStock(med, settings) = med.active && med.stock <= settings.lowStockThreshold.
      One selector feeds BOTH the UI badge and the notification planner, so they can never
      disagree. The badge shows on the Today row; the Inventory count uses the same predicate
      for its amber tint.
    legacy: |
      MedicationTrackerView.swift:238 and :305 hardcoded stock < 5.
      NotificationManager.swift:108 used stock <= settings.lowStockThreshold.
      At the default threshold 5 a med at exactly 5 alerted with no badge; at threshold 10
      the divergence covered stock 5-10.
    open_question: |
      The legacy badge did not check `active`. This rule adds the active gate so an inactive
      med shows no badge, matching the planner. REVIEW_AT_FREEZE if that is unwanted.
    affects: [medication_lifecycle, medication_search_and_segments, notification_planner]

  - id: D9
    topic: Consultation reminders honor the reminder setting
    resolved: 2026-11-07
    status: accepted
    rule: |
      Consultation trigger = consultation.date + offset(appointmentReminderTime), then the
      trigger > now guard. One setting governs every scheduled visit.
    legacy: |
      NotificationManager.swift:338-340 (iOS) and :229-230 (Android) used a fixed -24h and
      the Android helper took no settings parameter at all.
    rationale: |
      The setting is called "Appointment Alerts / Alert Time" and consultations are visits.
      A fixed offset that ignores it is a bug, not a preference.
    default_unchanged: appointmentReminderTime defaults to "1 day before", so the default
                       consultation behavior is identical to v0.0.19.
    affects: [notification_planner, settings_draft_commit]

  - id: D10
    topic: Vital edit and consultation delete are added in 1.0
    resolved: 2026-11-07
    status: accepted
    rule: |
      Vitals gain an edit affordance wired to the existing update semantics (replace by id,
      no re-sort, insert order preserved). Consultations gain a delete affordance (remove by
      id). Both are spec'd as full journeys.
    legacy: |
      MedicalViewModel.updateVital (:214-219) and deleteConsultation (:207-212) existed but
      had ZERO call sites in Sources/. AddVitalView had no edit mode; ConsultationsView had
      no delete affordance and no swipe action.
    rationale: Explicit scope addition approved at the Phase 1 boundary, not inferred.
    scope_warning: |
      This is the only decision that ADDS user-facing capability. Phase 4 must build the
      edit sheet and the delete button on both platforms.
    delete_semantics: |
      Immediate, no confirmation dialog, no undo — matching deleteVital and deleteAppointment
      as they ship today. Do not introduce a confirmation step for consultations only.
    affects: [vital_crud, consultation_crud]

  - id: D11
    topic: The rolling day window is preserved
    resolved: 2026-11-07
    status: accepted
    rule: |
      Both day strips are a rolling 7-cell window: center = startOfDay(now) + weekOffset*7 days,
      cells = center + (-3...+3) days. No weekday anchor. Paging is unbounded in both
      directions with no disabled state. selectedDate is NOT reset when metric, range or
      weekOffset changes, and may point outside the visible window.
    legacy: AppointmentsView.swift:146-159 and AllVitalsView.swift:198-287, :559-565.
    rationale: |
      Preserved deliberately. It is unusual but it is what users have, and anchoring to a
      calendar week would silently move every existing user's selected day.
    normalization_fix: |
      The legacy center used Date() with its time-of-day, so cell dates carried a clock time
      and same-day comparisons depended on it. Reflex normalizes the center to startOfDay.
      Observable behavior is identical because every comparison is isDate(inSameDayAs:).
    affects: [appointment_crud, vitals_detail_navigation]

  - id: D12
    topic: Recent activity "View all" routes to Meds / History
    resolved: 2026-11-07
    status: accepted
    rule: |
      The action selects tab 2 (Meds) AND sets medication_tracker.segment = history.
      Routing is a single root action so the segment cannot be left stale.
    legacy: DashboardView.swift:363-368 set selectedTab = 4, which is Vitals. There is no
            history tab. The logs listed are overwhelmingly medication doses.
    rationale: A header labelled "View all" over dose logs should land on the dose history.
    affects: [dashboard_derivation, dashboard_cross_tab_jump, medication_search_and_segments]

  - id: D13
    topic: The consultation form requires a doctor name
    resolved: 2026-11-07
    status: accepted
    rule: "canSave = !doctorName.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty"
    legacy: |
      NewConsultationView.swift:154, :193-215, :217-230 had no .disabled and no guard.
      A completely blank consultation saved successfully.
    rationale: The other three forms all gate Save; this one was simply missing its gate.
    preserved_asymmetry: |
      AddVital, AddMedication and AddAppointment gate on .isEmpty WITHOUT trimming, so
      whitespace-only input still passes on those three. That asymmetry is preserved and
      asserted, not silently unified. REVIEW_AT_FREEZE if it should be unified.
    affects: [consultation_crud]

  - id: D14
    topic: Value formatting is unified across the two vitals screens
    resolved: 2026-11-07
    status: REVIEW_AT_FREEZE
    rule: |
      weight        -> "%.1f" + " kg"
      bloodSugar    -> "%.0f" + " mg/dL"
      bloodPressure -> "Int(systolic)/Int(value2 ?? 0)" + " mmHg"
      The unit is appended exactly ONCE, by the row/card, never inside the value selector.
      Empty -> "--". Int() truncates toward zero.
    legacy: |
      Three real divergences between the two screens:
        - Sugar: VitalsView.swift:325 used %.1f, AllVitalsView.swift:657 used %.0f.
        - AllVitalsView appended the unit twice ("75.5 kg kg", "120/80 mmHg mmHg") because
          latestSelectedValue already contained it (:609 then :302-307).
        - Missing value2 rendered "/0" on both. That is preserved: it is a documented
          fallback, not a crash, and AddVital never requires value2.
      Also note the VitalsView metric CARD formatted sugar with %.1f (:166) while its own
      row used the selected metric's unit rather than the vital's type (:320-327).
    rationale: |
      mg/dL readings are integers in practice; %.1f implies a precision the device does not
      have. The duplicated unit is unambiguously a bug. Unifying changes the Vitals tab's
      sugar display from "120.0" to "120" - a visible, deliberate change.
    affects: [vital_crud, vitals_detail_navigation]

  - id: D15
    topic: Rendered date strings are not part of the contract
    resolved: 2026-11-07
    status: REVIEW_AT_FREEZE
    rule: |
      State carries Instants. No journey asserts a formatted date or time string.
      Locale-dependent rendering is verified in the Phase 4 device parity pass instead.
    legacy: |
      Every date render used DateFormatter.localizedString with .short/.medium styles
      (DashboardView.swift:227,317,322,405; AppointmentsView.swift:197;
      ConsultationsView.swift:169; MedicationTrackerView.swift:361). Output depends on device
      locale and timezone, and under Skip on the Kotlin formatter bridge.
    rationale: |
      Asserting "11/7/26, 2:30 PM" would fail on a different CI locale for reasons unrelated
      to behavior. Pin the instant, verify the pixels by hand.
    exception: The month header and weekday letters derive from the pinned UTC clock, so
               journeys may assert the underlying dates, never their rendered text.
    affects: [all]

  - id: D16
    topic: Every sort has a deterministic total order
    resolved: 2026-11-07
    status: REVIEW_AT_FREEZE
    rule: |
      Wherever the legacy code sorted by date alone, Reflex sorts by (date ascending, then
      id UUID-string ascending). Applies to appointments, vitals series, nextMedication
      selection and upcomingAppointments.
    legacy: |
      Swift's sorted(by:) is not guaranteed stable and no secondary key existed
      (DashboardView.swift:40,46; VitalsView.swift:164; MedicalViewModel.swift:171,231).
      Two readings with the same timestamp could order differently per run and per platform.
    rationale: |
      Parity is untestable against an unspecified order. Pinning a tie-break is the only way
      two independent implementations can diff clean. It changes nothing observable except
      in the tied case, which was previously arbitrary.
    nextMedication_ties: |
      nextDose nil sorts last (distantFuture). Among equal keys, lowest id wins. The legacy
      winner among ties was unspecified, so this pins previously undefined behavior rather
      than changing defined behavior.
    affects: [dashboard_derivation, appointment_crud, vital_crud, vitals_detail_navigation]

# --- Behaviors that look like bugs and are deliberately KEPT ---
# Listed so an implementer does not "helpfully" fix them and break parity.
preserved_quirks:
  - id: Q1
    behavior: nextMedication does not filter by future date. A past nextDose still renders
              as "Next dose" and its Mark taken button is live.
    evidence: DashboardView.swift:39-41
    asserted_in: [dashboard_derivation]
  - id: Q2
    behavior: upcomingAppointments uses date >= now (inclusive), while the Appointments tab
              applies no date filter at all and shows past appointments on a past day.
    evidence: DashboardView.swift:45 vs AppointmentsView.swift:112-114
    asserted_in: [dashboard_derivation, appointment_crud]
  - id: Q3
    behavior: The Today segment groups by exact case-sensitive schedule string. A medication
              whose schedule is none of Morning/Afternoon/Evening is invisible in Today but
              still counted in the total.
    evidence: MedicationTrackerView.swift:45-49, :149
    asserted_in: [medication_search_and_segments]
  - id: Q4
    behavior: History ignores the search query and shows time-of-day only, with no date, so
              doses from different days are visually indistinguishable.
    evidence: MedicationTrackerView.swift:326-343, :361
    asserted_in: [medication_search_and_segments]
  - id: Q5
    behavior: markTaken at stock 0 still writes a log; stock stays floored at 0. nextDose is
              always now + 86400s regardless of the schedule string.
    evidence: MedicalViewModel.swift:243-266
    asserted_in: [medication_lifecycle]
    note: D6 adds the already-taken-today guard, which makes the repeat case unreachable
          from the UI on the same day. The stock-0 floor is still reachable on a fresh day.
  - id: Q6
    behavior: AddMedication parses stock with Int(text) ?? 0. Empty, non-numeric, decimal and
              whitespace-padded input all become 0. A negative integer is accepted verbatim.
    evidence: AddMedicationView.swift:188
    asserted_in: [medication_lifecycle]
  - id: Q7
    behavior: AddVital's Save is disabled only on value.isEmpty. Whitespace or "abc" passes
              the gate, then Double() returns nil and save() silently does nothing - the sheet
              stays open with no error. Negative, zero, inf and nan are all accepted.
    evidence: AddVitalView.swift:138, :188, :195-202
    asserted_in: [vital_crud]
  - id: Q8
    behavior: Appointment.type is free text, not an enum. There is no notify toggle in the
              form; notify is hardcoded true on create and preserved on edit.
    evidence: AddAppointmentView.swift:66, :180, :191
    asserted_in: [appointment_crud]
  - id: Q9
    behavior: The consultation picker mutates a shared collection live. Dismissing it by
              swipe does NOT revert selections; there is no commit step.
    evidence: NewConsultationView.swift:134-136, :242-247, :264-266
    asserted_in: [consultation_crud]
    note: Reflex keeps live mutation but routes it through the parent machine's action so
          there is one owner. Observable behavior is unchanged.
  - id: Q10
    behavior: Deleting a medication leaves its UUID in every consultation's linkedMedications.
              The row renders blank, the picker no longer lists it, and saving writes the
              stale UUID back.
    evidence: MedicalViewModel.swift:193-198, NewConsultationView.swift:88-107, :223
    asserted_in: [consultation_crud]
  - id: Q11
    behavior: The consultations count badge shows the TOTAL, not the search-filtered count.
    evidence: ConsultationsView.swift:35
    asserted_in: [consultation_crud]
  - id: Q12
    behavior: Initials take the first character of the first two space-separated tokens, so
              "Dr. Sarah Jenkins" yields "DS", not "SJ". Empty yields "?".
    evidence: ConsultationsView.swift:191-196
    asserted_in: [consultation_crud]
  - id: Q13
    behavior: Finishing onboarding clears data but does NOT cancel already-scheduled
              notifications, because clearData() never calls save() or the scheduler.
    evidence: MedicalViewModel.swift:175-182
    asserted_in: [onboarding_journey]
    note: This one is a real leak. Reflex clears the schedule on clear-completed. Flagged
          REVIEW_AT_FREEZE - see the journey's divergence note.
  - id: Q14
    behavior: Saving unchanged notification settings still writes the file and reschedules.
              There is no dirty check.
    evidence: SettingsView.swift:87-91
    asserted_in: [settings_draft_commit]
  - id: Q15
    behavior: The onboarding overlay has only two text variants across five steps, not five.
              Step < 4 shows "Ready for the next one?" / "Next"; step 4 shows
              "Ready to use the app?" / "Get Started". Subtitle is constant.
    evidence: MainTabView.swift:76-77, :158
    asserted_in: [onboarding_journey]
  - id: Q16
    behavior: VitalsView.addVital inserts at index 0, so storage order is newest-added-first
              and unrelated to date. Every display sort is applied on read.
    evidence: MedicalViewModel.swift:153-156
    asserted_in: [vital_crud]
  - id: Q17
    behavior: Trend treats a DECREASE as good (emerald) for every metric, including weight
              and blood sugar, where that is not universally true.
    evidence: VitalsView.swift:65-68
    asserted_in: [vital_crud, vitals_detail_navigation]
  - id: Q18
    behavior: The Vitals tab applies NO time-range cutoff to its trend; Vitals Detail does.
              The same data can therefore show different trend badges on the two screens.
    evidence: VitalsView.swift:19-29 vs AllVitalsView.swift:22-47
    asserted_in: [vital_crud, vitals_detail_navigation]