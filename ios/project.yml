# Phase 4 live iOS app. The App layer stays OUT of Package.swift on purpose:
# it imports SwiftUI/UIKit, and `swift build` / `swift test` must keep working on macOS.
# Generate with: cd reflex/ios && xcodegen generate
name: PharmTrack
options:
  bundleIdPrefix: com.tunnxo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ReflexIOS:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "28"
targets:
  PharmTrack:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: ReflexIOS
        product: ReflexCore
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: PharmTrack
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tunnxo.medtrack
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES